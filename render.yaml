services:
  - type: web
    name: ubaidfastfoodz-api
    runtime: node
    rootDir: backend
    healthCheckPath: /health
    buildCommand: npm install && npx prisma generate
    # Do not run seed on every wake — it slows cold starts (UptimeRobot timeout).
    startCommand: npx prisma migrate deploy && npx tsx src/index.ts
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CLIENT_URL
        sync: false
