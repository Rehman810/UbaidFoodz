name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/deploy-backend.sh"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"
      - "scripts/deploy-backend.sh"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ubaid_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d ubaid_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/ubaid_ci?schema=public
      JWT_SECRET: ci-test-jwt-secret-with-at-least-32-characters
      PORT: 4000
      CLIENT_URL: http://localhost:3000

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm install
        working-directory: .

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Typecheck and build
        run: npm run build

      - name: Smoke test /health
        run: |
          npx tsx src/index.ts &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:4000/health | grep -q '"ok":true'; then
              echo "Health check passed"
              exit 0
            fi
            sleep 1
          done
          echo "Health check failed — server did not respond in time"
          exit 1

  deploy:
    name: Deploy to Oracle server
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      ORACLE_SSH_HOST: ${{ secrets.ORACLE_SSH_HOST || vars.ORACLE_SSH_HOST }}
      ORACLE_SSH_USER: ${{ secrets.ORACLE_SSH_USER || vars.ORACLE_SSH_USER }}
      ORACLE_SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_PRIVATE_KEY || vars.ORACLE_SSH_PRIVATE_KEY }}
      ORACLE_APP_DIR: ${{ secrets.ORACLE_APP_DIR || vars.ORACLE_APP_DIR }}
      API_SERVICE_NAME: ${{ secrets.API_SERVICE_NAME || vars.API_SERVICE_NAME }}

    steps:
      - name: Verify deploy configuration
        run: |
          missing=0
          if [ -z "$ORACLE_SSH_HOST" ]; then
            echo "::error::Missing ORACLE_SSH_HOST (Secrets or Variables tab) — set to 80.225.219.189"
            missing=1
          fi
          if [ -z "$ORACLE_SSH_USER" ]; then
            echo "::error::Missing ORACLE_SSH_USER — set to ubuntu"
            missing=1
          fi
          if [ -z "$ORACLE_SSH_PRIVATE_KEY" ]; then
            echo "::error::Missing ORACLE_SSH_PRIVATE_KEY — use the Secrets tab (not Variables) for the SSH key"
            missing=1
          fi
          if [ -z "$ORACLE_APP_DIR" ]; then
            echo "::error::Missing ORACLE_APP_DIR — set to /home/ubuntu/UbaidFoodz"
            missing=1
          fi
          if [ "$missing" -eq 1 ]; then
            echo "GitHub → Settings → Secrets and variables → Actions (Secrets or Variables)"
            exit 1
          fi

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.ORACLE_SSH_HOST }}
          username: ${{ env.ORACLE_SSH_USER }}
          key: ${{ env.ORACLE_SSH_PRIVATE_KEY }}
          port: 22
          envs: APP_DIR,API_SERVICE_NAME
          script: |
            cd "$APP_DIR"
            bash scripts/deploy-backend.sh
        env:
          APP_DIR: ${{ env.ORACLE_APP_DIR }}
          API_SERVICE_NAME: ${{ env.API_SERVICE_NAME }}
